name: Deploy Matra to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Web Assembly
        run: |
          mkdir -p web/wasm web/js
          GOOS=js GOARCH=wasm go build -o ./web/wasm/matra.wasm ./cmd/wasm

      - name: Copy Go WASM runtime
        run: |
          GOROOT="${go env GOROOT}"
          RUNTIME="$GOROOT/lib/wasm/wasm_exec.js"

          if [ ! -f "$RUNTIME" ]; then
            RUNTIME="$GOROOT/misc/wasm/wasm_exec.js"
          fi

          test -f "$RUNTIME"
          cp "$RUNTIME" ./web/js/wasm_exec.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
